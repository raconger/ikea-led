<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flights Simulator</title>
<style>
  :root {
    --bg: #f4f2ee; --surface: #ffffff; --text: #1d1c1a; --muted: #6d6a64;
    --border: #e2ded6; --accent: #c2410c; --panel: #121212; --led: 255, 236, 205;
    --ok: #15803d; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151515; --surface: #1e1e1e; --text: #ece9e4; --muted: #9a958d;
      --border: #2e2e2e; --accent: #fb923c; --panel: #0a0a0a; --ok: #4ade80; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px;
    display: grid; gap: 24px; grid-template-columns: minmax(0, 460px) minmax(0, 1fr);
  }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .device {
    background: #e9e6e0; border-radius: 6px; padding: 18px;
    box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.18);
  }
  canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 2px; background: var(--panel); cursor: crosshair; }
  .now { font: 600 15px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 8px; min-height: 21px; letter-spacing: .02em; overflow-wrap: anywhere; }
  .status { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; min-height: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .controls { display: grid; gap: 12px; margin-top: 16px; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; font-size: 13px; }
  label input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  label output { font-variant-numeric: tabular-nums; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
  .warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.num, th.num { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  tr.overhead td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tr.offscreen { opacity: .45; }
  .table-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .route-hidden { color: var(--muted); text-decoration: line-through; }
  .tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         padding: 6px 8px; border-radius: 6px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; z-index: 2; }
  .side { display: grid; gap: 16px; align-content: start; min-width: 0; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Flights simulator</h1>
    <p class="sub">The FlightTrackerPlugin logic running against live ADS-B data. Click a flight to feature it now.</p>
    <div class="device"><canvas id="led" width="640" height="640" aria-label="16 by 16 LED matrix"></canvas></div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Starting…</span></div>
    <div class="now" id="now" aria-live="polite"></div>
    <div class="card controls">
      <h2>Settings</h2>
      <label>Radar radius <output id="radiusOut"></output><input id="radius" type="range" min="3" max="40" step="1"></label>
      <label>Spotlight every <output id="spotlightOut"></output><input id="spotlight" type="range" min="0" max="120" step="5"></label>
      <label>Overhead distance <output id="overheadOut"></output><input id="overhead" type="range" min="1" max="10" step="0.5"></label>
      <label>Overhead max altitude <output id="maxAltOut"></output><input id="maxAlt" type="range" min="5000" max="45000" step="1000"></label>
      <label>Device brightness <output id="brightOut"></output><input id="bright" type="range" min="1" max="255" step="1">
        <span class="hint" id="brightHint"></span></label>
      <span class="hint">Sliders only affect this page. Firmware values live in <code>include/home_location.h</code>.</span>
    </div>
  </section>
  <section class="side">
    <div class="card">
      <h2>Aircraft in range</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Flight</th><th>Type</th><th>Route</th><th class="num">Alt</th><th class="num">Dist</th><th class="num">Hdg</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6">Waiting for data…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<div class="tip" id="tip"></div>
<script>
// ---- Constants mirrored from src/plugins/FlightTrackerPlugin.cpp ----------
const COLS = 16, ROWS = 16, HOME_X = 8, HOME_Y = 8, DEG = Math.PI / 180;
const MAX_BRIGHTNESS = 255;
const FRAME_MS = 50, BASE_INTERVAL_MS = 10000, MAX_INTERVAL_MS = 120000;
const STALE_MS = 90000, MAX_EXTRAPOLATE_S = 60, INFO_HOLD_MS = 8000;
const RESHOW_AFTER_MS = 10 * 60 * 1000, ROUTE_LOOKUPS_PER_CYCLE = 3, SCROLL_DELAY_MS = 60;
const MPH_PER_KNOT = 1.15078;
const LOCATE_MS = 1600, SPOTLIGHT_REPEAT_MS = 5 * 60 * 1000;
const PATH_BEHIND_PX = 4, PATH_AHEAD_PX = 3, COMET_TAIL_PX = 2.5, AHEAD_DIMMING = 0.6;
const PULSE_MS_AT_450KT = 1100, PULSE_MIN_MS = 700, PULSE_MAX_MS = 2600;
function phaseSeed(callsign) { // FNV-1a, same as firmware
  let h = 2166136261;
  for (const c of callsign) h = Math.imul(h ^ (c.charCodeAt(0) & 0xff), 16777619) >>> 0;
  return (h >>> 8) / 16777216;
}

let cfg, font, smallNumbers;
let aircraft = [];
const routes = new Map();
const frame = new Uint8Array(ROWS * COLS);
let deviceBrightness = 255;

// ---- Geometry ---------------------------------------------------------------
function toLocal(lat, lon) {
  return { north: (lat - cfg.lat) * 60, east: (lon - cfg.lon) * 60 * Math.cos(cfg.lat * DEG) };
}
function haversineNm(lat1, lon1, lat2, lon2) {
  const dLat = (lat2 - lat1) * DEG, dLon = (lon2 - lon1) * DEG;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * DEG) * Math.cos(lat2 * DEG) * Math.sin(dLon / 2) ** 2;
  return 3440.065 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function project(a, now) {
  const seconds = Math.min((now - a.positionAt) / 1000, MAX_EXTRAPOLATE_S);
  const travelled = a.groundSpeed * seconds / 3600;
  return { east: a.east + travelled * Math.sin(a.track * DEG), north: a.north + travelled * Math.cos(a.track * DEG) };
}
function altitudeBrightness(alt) {
  const low = 10000, high = 40000, bright = 255, dim = 40;
  if (alt <= low) return bright;
  if (alt >= high) return dim;
  return Math.trunc(bright - (alt - low) * (bright - dim) / (high - low));
}

// ---- Frame drawing ----------------------------------------------------------
function plot(x, y, b) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return;
  const i = y * COLS + x;
  frame[i] = Math.max(frame[i], b);
}
function line(x0, y0, x1, y1, b) {
  let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  let dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;) {
    plot(x0, y0, b);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
const lround = v => Math.sign(v) * Math.round(Math.abs(v)); // C lroundf: half away from zero
function bitsOf(bytes) { const out = []; for (const byte of bytes) for (let j = 7; j >= 0; j--) out.push((byte >> j) & 1); return out; }
function smallDigit(x, y, d, b) {
  bitsOf(smallNumbers[d]).forEach((bit, i) => { if (bit) plot(x + i % 4, y + Math.floor(i / 4), b); });
}

// ---- Display state machine (mirrors FlightTrackerPlugin::loop) --------------
let state = 'RADAR', stateStartedAt = 0, lastShownCallsign = '', lastShownAt = 0, infoCallsign = '';
let radarSince = Date.now();
const featuredAt = new Map();
let scroll = null; // { text, startedAt } — the firmware blocks in scrollText; here it's a state

function findOverhead(list, now) {
  let best = null, bestDistance = cfg.overheadNm;
  for (const a of list) {
    if (!a.callsign || a.altitude > cfg.overheadMaxAltFt || now - a.positionAt > STALE_MS) continue;
    const p = project(a, now), d = Math.hypot(p.east, p.north);
    if (d <= bestDistance) { bestDistance = d; best = a; }
  }
  return best;
}

function findSpotlight(list, now) {
  let best = null, bestDistance = Infinity;
  for (const a of list) {
    if (!a.callsign || now - a.positionAt > STALE_MS) continue;
    const shown = featuredAt.get(a.callsign);
    if (shown !== undefined && now - shown < SPOTLIGHT_REPEAT_MS) continue;
    const p = project(a, now);
    if (Math.abs(p.east) >= cfg.radiusNm || Math.abs(p.north) >= cfg.radiusNm) continue;
    const d = Math.hypot(p.east, p.north);
    if (d < bestDistance) { bestDistance = d; best = a; }
  }
  return best;
}

function feature(a, now) {
  for (const [cs, t] of featuredAt) if (now - t >= SPOTLIGHT_REPEAT_MS) featuredAt.delete(cs);
  featuredAt.set(a.callsign, now);
  infoCallsign = a.callsign; state = 'LOCATE'; stateStartedAt = now;
}

const DIRECTIONS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
function detailsText(a, now) {
  let text = a.callsign;
  const r = routes.get(a.callsign);
  if (r && r.known && r.plausible) text += ` ${r.origin}>${r.destination}`;
  if (a.type) text += ` ${a.type}`;
  text += ` ${Math.trunc((a.altitude + 50) / 100) * 100}FT ${lround(a.groundSpeed * MPH_PER_KNOT)}MPH`;
  const p = project(a, now), d = Math.hypot(p.east, p.north);
  if (d < 1) text += ' OVERHEAD';
  else {
    let bearing = Math.atan2(p.east, p.north) / DEG;
    if (bearing < 0) bearing += 360;
    text += ` ${lround(d)}NM ${DIRECTIONS[lround(bearing / 45) % 8]}`;
  }
  return text;
}

function tick(now) {
  const featured = infoCallsign ? aircraft.find(x => x.callsign === infoCallsign) : null;
  if (state === 'LOCATE') {
    if (!featured) { state = 'RADAR'; radarSince = now; }
    else if (now - stateStartedAt < LOCATE_MS) { drawRadar(now, featured.callsign); return; }
    else {
      scroll = { text: detailsText(featured, now), startedAt: now };
      setNowShowing(scroll.text);
      state = 'SCROLL';
    }
  }
  if (state === 'SCROLL') {
    if (drawScroll(now)) return;
    state = 'OVERHEAD_INFO'; stateStartedAt = now;
  }
  if (state === 'OVERHEAD_INFO') {
    if (now - stateStartedAt < INFO_HOLD_MS && featured) { drawInfo(featured); return; }
    state = 'RADAR'; radarSince = now; setNowShowing('');
  }
  const o = findOverhead(aircraft, now);
  if (o && (lastShownCallsign !== o.callsign || now - lastShownAt > RESHOW_AFTER_MS)) {
    lastShownCallsign = o.callsign; lastShownAt = now;
    feature(o, now); drawRadar(now, o.callsign);
    return;
  }
  if (cfg.spotlightSeconds > 0 && now - radarSince >= cfg.spotlightSeconds * 1000) {
    const sp = findSpotlight(aircraft, now);
    if (sp) { feature(sp, now); drawRadar(now, sp.callsign); return; }
    radarSince = now;
  }
  drawRadar(now);
}

// Screen_::scrollText: text starts off the right edge, one pixel per delay
function drawScroll(now) {
  const step = Math.floor((now - scroll.startedAt) / SCROLL_DELAY_MS);
  const textWidth = scroll.text.length * (font.sizeX + 1);
  const i = -ROWS + step;
  if (i >= textWidth) return false;
  frame.fill(0);
  [...scroll.text].forEach((ch, pos) => {
    const xPos = pos * (font.sizeX + 1) - i;
    if (xPos <= -6 || xPos >= ROWS) return;
    let code = ch.charCodeAt(0) - font.offset;
    if (code < 0 || code >= font.data.length) code = 0;
    bitsOf(font.data[code]).forEach((bit, k) => {
      if (bit) plot(xPos + k % 8, 4 + Math.floor(k / 8), MAX_BRIGHTNESS);
    });
  });
  return true;
}

function drawRadar(now, highlight = null) {
  frame.fill(0);
  const blinkOn = Math.floor(now / 200) % 2 === 0;
  let anyFresh = false;
  const pixelsPerNm = (COLS / 2) / cfg.radiusNm;
  for (const a of aircraft) {
    if (now - a.positionAt > STALE_MS) continue;
    anyFresh = true;
    const p = project(a, now);
    const px = HOME_X + p.east * pixelsPerNm, py = HOME_Y - p.north * pixelsPerNm;
    const x = Math.floor(px), y = Math.floor(py);
    if (highlight && a.callsign === highlight) {
      plot(x, y, blinkOn ? MAX_BRIGHTNESS : 60);
      if (blinkOn) { plot(x - 1, y, 140); plot(x + 1, y, 140); plot(x, y - 1, 140); plot(x, y + 1, 140); }
      continue;
    }
    const b = Math.trunc(altitudeBrightness(a.altitude) / (highlight ? 4 : 1));
    const dirX = Math.sin(a.track * DEG), dirY = -Math.cos(a.track * DEG);
    plot(Math.floor(px - dirX), Math.floor(py - dirY), Math.max(Math.trunc(b / 6), 12));
    // "Ghost rider" pulse sweeping along the flight path
    const periodMs = Math.min(Math.max(PULSE_MS_AT_450KT * 450 / Math.max(a.groundSpeed, 60), PULSE_MIN_MS), PULSE_MAX_MS);
    const phase = ((now % Math.trunc(periodMs)) / periodMs + phaseSeed(a.callsign)) % 1;
    const cometHead = -PATH_BEHIND_PX + phase * (PATH_BEHIND_PX + PATH_AHEAD_PX + COMET_TAIL_PX);
    for (let t = -PATH_BEHIND_PX; t <= PATH_AHEAD_PX; t += 0.5) {
      const behindHead = cometHead - t;
      if (behindHead < 0 || behindHead > COMET_TAIL_PX) continue;
      let intensity = 1 - behindHead / COMET_TAIL_PX;
      if (t > 0) intensity *= AHEAD_DIMMING;
      plot(Math.floor(px + dirX * t), Math.floor(py + dirY * t), Math.trunc(b * intensity));
    }
    plot(Math.floor(px), Math.floor(py), b);
  }
  if (!anyFresh) {
    const angle = (now % 3000) / 3000 * 360 * DEG;
    for (let k = 0; k < 2; k++) {
      const a = angle - k * 20 * DEG;
      line(HOME_X, HOME_Y, HOME_X + lround(7 * Math.sin(a)), HOME_Y - lround(7 * Math.cos(a)), k ? 20 : 70);
    }
  }
  plot(HOME_X, HOME_Y, Math.trunc(25 + 25 * (0.5 + 0.5 * Math.sin(now / 600))));
}

function drawInfo(a) {
  frame.fill(0);
  const cx = 7, cy = 4, r = 4;
  const sx = Math.sin(a.track * DEG), sy = -Math.cos(a.track * DEG);
  const tipX = cx + lround(sx * r), tipY = cy + lround(sy * r);
  line(cx - lround(sx * r), cy - lround(sy * r), tipX, tipY, 255);
  for (const side of [-1, 1]) {
    const h = (a.track + 180 + side * 35) * DEG;
    line(tipX, tipY, tipX + lround(Math.sin(h) * 3), tipY - lround(Math.cos(h) * 3), 255);
  }
  const thousands = Math.min(Math.max(Math.trunc((a.altitude + 500) / 1000), 0), 99);
  if (thousands >= 10) { smallDigit(3, 10, Math.trunc(thousands / 10), 255); smallDigit(8, 10, thousands % 10, 255); }
  else smallDigit(5, 10, thousands, 255);
  if (a.verticalRate > 300) { plot(14, 10, 160); line(13, 11, 15, 11, 160); line(14, 12, 14, 14, 160); }
  else if (a.verticalRate < -300) { line(14, 10, 14, 12, 160); line(13, 13, 15, 13, 160); plot(14, 14, 160); }
  else line(13, 12, 15, 12, 160);
}

// ---- LED panel rendering ----------------------------------------------------
const canvas = document.getElementById('led'), ctx = canvas.getContext('2d');
function paint() {
  const W = canvas.width, cell = W / COLS;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel');
  ctx.fillRect(0, 0, W, W);
  const led = getComputedStyle(document.documentElement).getPropertyValue('--led').trim();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const cxp = (x + .5) * cell, cyp = (y + .5) * cell;
    // Same PWM scaling as Screen_::_render: value * brightness / 255
    const duty = Math.floor(frame[y * COLS + x] * deviceBrightness / MAX_BRIGHTNESS) / 255;
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    ctx.beginPath(); ctx.arc(cxp, cyp, cell * .28, 0, Math.PI * 2); ctx.fill();
    if (duty <= 0) continue;
    const g = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, cell * .75);
    g.addColorStop(0, `rgba(${led},${Math.min(1, duty * 1.1)})`);
    g.addColorStop(.35, `rgba(${led},${duty * .75})`);
    g.addColorStop(1, `rgba(${led},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(cxp - cell, cyp - cell, cell * 2, cell * 2);
  }
}

let lastFrame = 0;
function animate(now) {
  const t = Date.now();
  if (t - lastFrame >= FRAME_MS && cfg) { lastFrame = t; tick(t); paint(); }
  requestAnimationFrame(animate);
}

// ---- Fetching (mirrors fetchLoop / fetchAircraft / lookupRoutes) ------------
let fetchIntervalMs = BASE_INTERVAL_MS, lastSource = '', lastFetchAt = 0, deviceInactive = false;

async function fetchAircraft() {
  const res = await fetch('api/aircraft');
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  const now = Date.now();
  aircraft = data.aircraft
    // Device sends positions relative to home (east/north); the local proxy sends lat/lon.
    .filter(a => (typeof a.east === 'number' || (typeof a.lat === 'number' && typeof a.lon === 'number')) && typeof a.alt_baro === 'number')
    .map(a => {
      const p = typeof a.east === 'number' ? { east: a.east, north: a.north } : toLocal(a.lat, a.lon);
      if (a.route && a.flight) routes.set(a.flight.trim(), a.route); // device's own route decision
      return {
        callsign: (a.flight || '').trim().slice(0, 8), type: (a.t || '').slice(0, 4),
        east: p.east, north: p.north, groundSpeed: a.gs || 0, track: a.track || 0,
        altitude: Math.trunc(a.alt_baro), verticalRate: a.baro_rate || 0,
        positionAt: now - (a.seen_pos || 0) * 1000,
      };
    });
  lastSource = data.source; lastFetchAt = now;
  deviceInactive = data.active === false;
}

async function fetchRoute(a) {
  const res = await fetch('https://api.adsbdb.com/v0/callsign/' + encodeURIComponent(a.callsign));
  if (res.status === 404) return { known: false, plausible: false };
  if (!res.ok) return null;
  const fr = (await res.json()).response?.flightroute;
  if (!fr?.origin || !fr?.destination) return { known: false, plausible: false };
  const o = fr.origin, d = fr.destination;
  const planeLat = cfg.lat + a.north / 60, planeLon = cfg.lon + a.east / (60 * Math.cos(cfg.lat * DEG));
  const direct = haversineNm(o.latitude, o.longitude, d.latitude, d.longitude);
  const via = haversineNm(o.latitude, o.longitude, planeLat, planeLon) + haversineNm(planeLat, planeLon, d.latitude, d.longitude);
  return {
    known: true, plausible: via <= direct * 1.2 + 30,
    origin: (o.iata_code || o.icao_code || '').slice(0, 4), destination: (d.iata_code || d.icao_code || '').slice(0, 4),
    fullOrigin: o.municipality, fullDestination: d.municipality,
  };
}

async function lookupRoutes() {
  const todo = aircraft
    .filter(a => /^[A-Z]{3}\d/i.test(a.callsign)) // airline callsigns, not tail numbers
    .map(a => ({ a, d: Math.hypot(a.east, a.north) }))
    .filter(c => c.d <= cfg.radiusNm * 1.42 && !routes.has(c.a.callsign))
    .sort((x, y) => x.d - y.d)
    .slice(0, ROUTE_LOOKUPS_PER_CYCLE);
  for (const { a } of todo) {
    const r = await fetchRoute(a).catch(() => null);
    if (r) routes.set(a.callsign, r);
  }
}

async function fetchLoop() {
  for (;;) {
    try {
      await fetchAircraft();
      fetchIntervalMs = BASE_INTERVAL_MS;
      await lookupRoutes();
      setStatus(true);
    } catch (e) {
      fetchIntervalMs = Math.min(fetchIntervalMs * 2, MAX_INTERVAL_MS);
      setStatus(false, e.message);
    }
    renderTable();
    await new Promise(r => setTimeout(r, fetchIntervalMs));
  }
}

// ---- UI -------------------------------------------------------------------
const $ = id => document.getElementById(id);
function setNowShowing(text) { $('now').textContent = text; }
function setStatus(ok, msg) {
  $('dot').className = 'dot ' + (ok ? 'ok' : 'err');
  if (ok && deviceInactive) {
    $('dot').className = 'dot err';
    $('status').textContent = 'The Flights plugin isn’t active on the device, so its data is stale. Switch the device to Flights.';
    return;
  }
  $('status').textContent = ok
    ? `${aircraft.length} aircraft from ${lastSource} · updated ${new Date(lastFetchAt).toLocaleTimeString()} · every ${fetchIntervalMs / 1000}s`
    : `Fetch failed (${msg}); retrying in ${fetchIntervalMs / 1000}s`;
}

function renderTable() {
  const now = Date.now(), overhead = findOverhead(aircraft, now);
  const rows = aircraft.map(a => ({ a, p: project(a, now) }))
    .map(x => ({ ...x, d: Math.hypot(x.p.east, x.p.north) }))
    .sort((x, y) => x.d - y.d);
  $('rows').innerHTML = rows.map(({ a, p, d }) => {
    const r = routes.get(a.callsign);
    const route = !r ? '' : !r.known ? '<span class="hint">unknown</span>'
      : `<span class="${r.plausible ? '' : 'route-hidden'}" title="${r.plausible ? '' : 'Hidden: plane isn\'t between these airports (stale route)'}">${r.origin}→${r.destination}</span>`;
    const off = Math.abs(p.east) > cfg.radiusNm || Math.abs(p.north) > cfg.radiusNm;
    const cls = [a === overhead ? 'overhead' : '', off ? 'offscreen' : ''].join(' ');
    return `<tr class="${cls}" data-cs="${a.callsign}"><td>${a.callsign || '<span class="hint">—</span>'}</td><td>${a.type}</td><td>${route}</td>
      <td class="num">${(a.altitude / 1000).toFixed(1)}k</td><td class="num">${d.toFixed(1)}</td><td class="num">${Math.round(a.track)}°</td></tr>`;
  }).join('') || '<tr><td colspan="6">No aircraft in range</td></tr>';
}

$('rows').addEventListener('click', async e => {
  const tr = e.target.closest('tr[data-cs]');
  const a = tr && aircraft.find(x => x.callsign === tr.dataset.cs && x.callsign);
  if (!a) return;
  if (!routes.has(a.callsign)) { const r = await fetchRoute(a).catch(() => null); if (r) routes.set(a.callsign, r); renderTable(); }
  feature(a, Date.now());
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / rect.width * COLS), y = Math.floor((e.clientY - rect.top) / rect.height * ROWS);
  const now = Date.now(), ppn = (COLS / 2) / cfg.radiusNm;
  const hit = state === 'RADAR' && aircraft.find(a => {
    const p = project(a, now);
    return Math.floor(HOME_X + p.east * ppn) === x && Math.floor(HOME_Y - p.north * ppn) === y;
  });
  const tip = $('tip');
  if (!hit) { tip.style.display = 'none'; return; }
  tip.style.display = 'block';
  tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  tip.textContent = `${hit.callsign || '(no callsign)'} ${hit.type} · ${hit.altitude.toLocaleString()} ft · ${Math.round(hit.groundSpeed * MPH_PER_KNOT)} mph`;
});
canvas.addEventListener('mouseleave', () => { $('tip').style.display = 'none'; });

function bindSlider(id, key, fmt, onChange) {
  const input = $(id), out = $(id + 'Out');
  const get = () => key ? cfg[key] : deviceBrightness;
  input.value = get();
  const update = () => {
    const v = parseFloat(input.value);
    if (key) cfg[key] = v; else deviceBrightness = v;
    out.textContent = fmt(v);
    onChange && onChange(v);
    renderTable();
  };
  input.addEventListener('input', update);
  update();
}

async function init() {
  const res = await fetch('api/config');
  const data = await res.json();
  cfg = data.config; font = data.glyphs.system; smallNumbers = data.glyphs.smallNumbers;
  const saved = (() => { try { return parseInt(localStorage.getItem('flightsim.brightness')); } catch { return NaN; } })();
  deviceBrightness = Number.isFinite(saved) ? saved : 255;
  bindSlider('radius', 'radiusNm', v => `${v} nm`);
  if (cfg.spotlightSeconds === undefined) cfg.spotlightSeconds = 20;
  bindSlider('spotlight', 'spotlightSeconds', v => v ? `${v} s` : 'off');
  bindSlider('overhead', 'overheadNm', v => `${v} nm`);
  bindSlider('maxAlt', 'overheadMaxAltFt', v => `${v.toLocaleString()} ft`);
  bindSlider('bright', null, v => `${v} / 255`, v => {
    try { localStorage.setItem('flightsim.brightness', v); } catch {}
    const dimmest = Math.floor(40 * v / 255);
    $('brightHint').innerHTML = dimmest < 10
      ? `<span class="warn">High-altitude planes render at ${dimmest}/255 PWM: barely visible on hardware.</span>`
      : `Dimmest plane renders at ${dimmest}/255 PWM.`;
  });
  requestAnimationFrame(animate);
  fetchLoop();
}
init().catch(e => setStatus(false, e.message));
</script>
</body>
</html>
